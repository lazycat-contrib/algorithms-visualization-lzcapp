manifest: ./lzc-manifest.yml

# buildscript: 构建 Vue/Vite 站点（selfhost 模式 base=/）并预渲染出 dist/
buildscript: ./build.sh

# contentdir: 指定打包的内容，将会打包到 lpk 中（build.sh 构建出的 dist/）
contentdir: ./dist

# pkgout: lpk 包的输出路径
pkgout: ./.lazycat-build/

# icon 指定 lpk 包 icon 的路径路径，如果不指定将会警告
# icon 仅仅允许 png 后缀的文件
icon: ./icon.png
